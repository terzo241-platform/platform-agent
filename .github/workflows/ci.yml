name: Platform Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check ford_platform_agent/ tests/

      - name: Format check
        run: ruff format --check ford_platform_agent/ tests/

      - name: Test
        run: pytest --cov=ford_platform_agent --cov-report=term-missing -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ${{ github.repository_owner }}

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build container
        run: docker build -t ford-platform-agent:${{ github.sha }} .

      - name: Verify container starts
        run: |
          docker run --rm -d --name agent-test \
            -e GITHUB_TOKEN=test \
            -e GITHUB_ORG=test \
            ford-platform-agent:${{ github.sha }}
          sleep 3
          docker logs agent-test
          docker stop agent-test
